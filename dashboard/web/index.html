<!doctype html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="A new Flutter project." />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="dashboard" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>dashboard</title>
  <link rel="manifest" href="manifest.json" />

  <!--
      Required for google_maps_flutter on Flutter Web: the plugin talks to
      the browser's `google.maps` JS object, which only exists once this
      script has loaded. Without it, GoogleMap() crashes with
      "Cannot read properties of undefined (reading 'MapTypeId')" — which is
      exactly the red error screen on the location picker.

      Replace YOUR_GOOGLE_MAPS_API_KEY with the SAME key you pass via
      --dart-define=GOOGLE_MAPS_API_KEY=... when running/building the app.
      That dart-define only reaches Dart code — this separate script tag is
      what the web platform needs, so the key has to be set in both places.
      Get/enable a key at https://console.cloud.google.com (enable "Maps
      JavaScript API" and "Places API").
    -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBfZvLyqF7oWQtSIJm1MJN4jRteN2nCQTM&libraries=places"
    async defer></script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
